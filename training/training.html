<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academic Dashboard · Training</title>
<style>
:root { --acc: #14924a; --bg: #05070b; --ink: #eef0f8; --ink2: #a9b0c2; --line: #2a3242; --hd: 'Oswald', 'Arial Narrow', 'Roboto Condensed', Arial, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.45 'Inter', 'Segoe UI', Arial, sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }

/* ---- the screen fills the whole window ---- */
.stage { position: fixed; inset: 0; overflow: hidden; background: #000; }
.screen { position: absolute; left: 0; top: 0; overflow: visible; }
.cam { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; transition: transform 2.4s cubic-bezier(.22,.8,.2,1); will-change: transform; }
.cam.snap { transition: none; }
.shot { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .7s ease, filter .7s ease; filter: blur(6px) saturate(.6); }
.shot.show { opacity: 1; filter: none; }
.dim { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; transition: opacity .9s ease .25s; }
.dim.show { opacity: 1; }
.hot { position: absolute; border: 3px solid #ffd23f; border-radius: 6px; box-shadow: 0 0 0 4px rgba(255,210,63,.18), 0 0 24px rgba(255,210,63,.55); opacity: 0; transform: scale(1.25); transition: opacity .5s ease, transform .6s cubic-bezier(.2,1.4,.4,1); pointer-events: none; }
.hot.show { opacity: 1; transform: scale(1); }
.hot.show::after { content: ''; position: absolute; inset: -3px; border: 3px solid #ffd23f; border-radius: 6px; animation: pulse 1.8s ease-out infinite; }
.hot i { position: absolute; left: 3px; top: -14px; width: 26px; height: 26px; border-radius: 50%; background: #ffd23f; color: #111; font: 800 14px/26px Arial, sans-serif; text-align: center; font-style: normal; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
@keyframes pulse { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.18); } }
.cur { position: absolute; width: 26px; height: 26px; left: 50%; top: 110%; pointer-events: none; transition: left 1.1s cubic-bezier(.5,0,.2,1), top 1.1s cubic-bezier(.5,0,.2,1), opacity .4s; filter: drop-shadow(0 3px 4px rgba(0,0,0,.6)); z-index: 3; }
.cur svg { width: 26px; height: 26px; }
.rip { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 3px solid #fff; pointer-events: none; animation: rip .7s ease-out forwards; z-index: 2; }
@keyframes rip { from { opacity: 1; transform: scale(.4); } to { opacity: 0; transform: scale(4); } }
.flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.flash.go { animation: flash .45s ease-out; }
@keyframes flash { 0% { opacity: .16; } 100% { opacity: 0; } }
.scan { position: fixed; left: 0; right: 0; height: 140px; top: -140px; background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--acc) 22%, transparent), transparent); pointer-events: none; }
.scan.go { animation: scan 1.1s ease-in-out; }
@keyframes scan { from { top: -140px; } to { top: 100%; } }

/* ---- floating controls (hide when the mouse rests) ---- */
.ui { transition: opacity .5s ease, transform .5s ease; }
body.idle .ui { opacity: 0; pointer-events: none; }
body.idle .ui.top { transform: translateY(-8px); } body.idle .ui.bot { transform: translateY(8px); }
.top { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 20; }
.badge { position: fixed; top: 12px; left: 12px; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 8px; background: rgba(8,10,15,.72); border: 1px solid var(--line); backdrop-filter: blur(8px); }
.badge img { height: 26px; }
.badge b { font: 700 15px/1 var(--hd); letter-spacing: .08em; text-transform: uppercase; }
.badge small { color: var(--acc); font: 700 10px/1 Arial, sans-serif; letter-spacing: .2em; display: block; margin-bottom: 3px; }
.ib { height: 34px; min-width: 34px; padding: 0 11px; border: 1px solid var(--line); background: rgba(8,10,15,.72); backdrop-filter: blur(8px); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 12.5px; letter-spacing: .04em; transition: background .2s, border-color .2s; }
.ib:hover { border-color: var(--acc); }
.ib.on { background: var(--acc); border-color: var(--acc); color: #fff; }
.ib.x { background: #c62828; border-color: #c62828; color: #fff; font-weight: 700; }
.ib svg { width: 16px; height: 16px; }
.bot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; align-items: center; gap: 8px; padding: 26px 14px 12px; background: linear-gradient(0deg, rgba(0,0,0,.75), transparent); }
.prog { flex: 1; display: flex; gap: 4px; height: 24px; align-items: center; }
.prog button { flex: 1; height: 6px; border: 0; padding: 0; background: rgba(255,255,255,.22); position: relative; overflow: hidden; transition: height .2s; }
.prog button:hover { height: 12px; }
.prog button i { position: absolute; inset: 0; width: 0; background: var(--acc); }
.prog button.done i { width: 100%; }
.prog button.now i { transition: width linear; }
.cnt { font: 700 14px/1 var(--hd); letter-spacing: .08em; min-width: 56px; text-align: center; text-shadow: 0 1px 3px #000; }

/* ---- cover / end slides fill the window ---- */
.slide { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; z-index: 15; background: radial-gradient(1100px 600px at 50% 40%, color-mix(in srgb, var(--acc) 30%, #0b0f17) 0%, #05070b 75%); transition: opacity .6s ease; }
.slide[hidden] { display: none; }
.slide.out { opacity: 0; pointer-events: none; }
.slide .lg { height: 78px; margin-bottom: 24px; animation: rise .9s ease both; }
.slide small { font: 700 13px/1 Arial, sans-serif; letter-spacing: .3em; color: color-mix(in srgb, var(--acc) 60%, #fff); text-transform: uppercase; animation: rise .9s ease .1s both; }
.slide h1 { margin: 12px 0 8px; font: 700 clamp(38px, 7vw, 84px)/1.05 var(--hd); letter-spacing: .04em; text-transform: uppercase; animation: rise .9s ease .2s both; }
.slide p { margin: 0 0 6px; color: var(--ink2); font-size: 19px; animation: rise .9s ease .3s both; }
.slide .meta { display: flex; gap: 26px; margin: 20px 0 32px; color: var(--ink2); font-size: 14px; letter-spacing: .06em; animation: rise .9s ease .4s both; }
.slide .meta b { color: #fff; font-size: 22px; display: block; font-family: var(--hd); }
.go-btn { border: 0; background: var(--acc); color: #fff; padding: 17px 38px; font: 700 18px/1 var(--hd); letter-spacing: .12em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 12px; box-shadow: 0 10px 40px color-mix(in srgb, var(--acc) 50%, transparent); animation: rise .9s ease .5s both, glow 2.4s ease-in-out 1.4s infinite; }
.go-btn:hover { filter: brightness(1.1); }
.go-btn.ghost { background: #1a202c; box-shadow: none; animation: rise .9s ease .6s both; }
.btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.list { display: grid; gap: 10px; width: min(580px, 100%); margin-top: 10px; animation: rise .9s ease .4s both; }
.list button { text-align: left; border: 1px solid var(--line); background: #121722; padding: 14px 16px; display: flex; align-items: center; gap: 12px; border-left: 5px solid var(--c, var(--acc)); }
.list button:hover { background: #18202e; }
.list button b { font: 700 17px/1.2 var(--hd); letter-spacing: .05em; text-transform: uppercase; display: block; }
.list button span { color: var(--ink2); font-size: 13px; }
.err { color: #ff8a80; }
@keyframes rise { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
@keyframes glow { 50% { box-shadow: 0 10px 60px color-mix(in srgb, var(--acc) 85%, transparent); } }
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="screen" id="screen">
    <div class="cam" id="cam">
      <img class="shot" id="imgA" alt=""><img class="shot" id="imgB" alt="">
      <svg class="dim" id="dim" viewBox="0 0 100 100" preserveAspectRatio="none"><defs><mask id="mk"><rect width="100" height="100" fill="white"/><g id="holes"></g></mask></defs><rect width="100" height="100" fill="rgba(3,5,10,.62)" mask="url(#mk)"/></svg>
      <div id="hots"></div>
      <div class="cur" id="cur"><svg viewBox="0 0 24 24"><path d="M4 2l16 11-7 1.2 4 7.3-3 1.5-4-7.3L4 20z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
    </div>
  </div>
</main>
<div class="scan" id="scan"></div>
<div class="flash" id="flash"></div>

<div class="badge ui top-l"><img src="../Images/logo.png" alt="" onerror="this.style.display='none'"><div><small>Training</small><b id="mTitle">Academic Dashboard</b></div></div>
<div class="top ui">
  <button class="ib on" id="bVoice" title="Voice on or off (M)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path id="wav" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
  <button class="ib on" id="bAuto" title="Play the steps by themselves"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v16M20 12 8 4v16z"/></svg></button>
  <button class="ib" id="bMenu" title="All trainings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <button class="ib x" id="bClose" title="Close (Esc)">✕</button>
</div>
<footer class="bot ui">
  <button class="ib" id="bPrev" title="Previous (←)">‹</button>
  <button class="ib" id="bPlay" title="Pause or play (Space)">❚❚</button>
  <button class="ib" id="bNext" title="Next (→)">›</button>
  <div class="prog" id="prog"></div>
  <span class="cnt" id="cnt"></span>
</footer>

<section class="slide" id="sCover" hidden></section>
<section class="slide" id="sEnd" hidden></section>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var Q = new URLSearchParams(location.search), EMBED = Q.get('embed') === '1';
  var IW = 1600, IH = 900;                       /* size of the training pictures */
  var DATA = null, MOD = null, idx = -1, playing = true, voiceOn = true, autoOn = true, timer = 0, flip = false, tok = 0, CUR = null;
  try { voiceOn = localStorage.getItem('adTrVoice') !== '0'; autoOn = localStorage.getItem('adTrAuto') !== '0'; } catch (e) { }

  /* ---------- data: trainings.json, or trainings.js when the page is a local file ---------- */
  function load() {
    return (location.protocol === 'file:' ? Promise.reject(new Error('file')) : fetch('trainings.json', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }))
      .catch(function () {
        return new Promise(function (ok, no) {
          if (window.AD_TRAININGS) return ok(window.AD_TRAININGS);
          var s = document.createElement('script'); s.src = 'trainings.js';
          s.onload = function () { window.AD_TRAININGS ? ok(window.AD_TRAININGS) : no(new Error('No training data')); };
          s.onerror = function () { no(new Error('trainings.json / trainings.js not found')); };
          document.head.appendChild(s);
        });
      });
  }

  /* ---------- male voice ---------- */
  var VOICE = null, PITCH = 1;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    var vs = speechSynthesis.getVoices().filter(function (v) { return /^en/i.test(v.lang); }); if (!vs.length) return;
    var male = [/Google UK English Male/i, /Microsoft (Guy|Ryan|Christopher|Andrew|Brian|Eric|Davis|Roger|Steffan|Thomas|William|Liam|Connor|George|David|Mark|James|Richard)\b/i,
      /\b(Daniel|Alex|Arthur|Aaron|Oliver|Rishi|Gordon|Fred|Tom|Lee|Reed|Eddy|Rocko|Ralph)\b/i, /\bmale\b/i];
    VOICE = null; PITCH = 1;
    for (var i = 0; i < male.length && !VOICE; i++) for (var j = 0; j < vs.length; j++) if (male[i].test(vs[j].name)) { VOICE = vs[j]; break; }
    if (!VOICE) { VOICE = vs[0]; PITCH = 0.75; }   /* no male voice on this computer: lower the pitch of the one there is */
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function hush() { tok++; try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) { } }
  function say(text, done) {
    try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) { }
    var my = tok, nw = text.split(/\s+/).length, fin = false, started = false, fell = false;
    var finish = function () { if (fin || my !== tok) return; fin = true; done(); };
    var fallback = function () { if (fell || fin || my !== tok) return; fell = true; timer = setTimeout(finish, nw * 330 + 1400); };
    if (!voiceOn || !('speechSynthesis' in window)) return fallback();
    var u = new SpeechSynthesisUtterance(text); if (VOICE) { u.voice = VOICE; u.lang = VOICE.lang; } u.rate = 1; u.pitch = PITCH;
    u.onstart = function () { started = true; };
    u.onend = function () { if (started) finish(); else fallback(); };
    u.onerror = function () { if (started) finish(); else fallback(); };
    speechSynthesis.speak(u);
    setTimeout(function () { if (!started && !speechSynthesis.speaking) fallback(); }, 1500);   /* no voice / blocked */
    setTimeout(finish, nw * 650 + 6000);                                                        /* safety net */
    var keep = setInterval(function () { if (my !== tok || fin || !speechSynthesis.speaking) return clearInterval(keep); speechSynthesis.pause(); speechSynthesis.resume(); }, 10000);
  }

  /* ---------- the picture covers the whole window; the camera keeps the hotspots in view ---------- */
  var G = { w: 0, h: 0, ox: 0, oy: 0, vw: 0, vh: 0 };
  function fit() {
    var vw = window.innerWidth, vh = window.innerHeight, k = Math.max(vw / IW, vh / IH);
    G = { w: IW * k, h: IH * k, vw: vw, vh: vh };
    G.ox = (vw - G.w) / 2; G.oy = (vh - G.h) / 2;
    var sc = $('screen'); sc.style.width = G.w + 'px'; sc.style.height = G.h + 'px'; sc.style.left = G.ox + 'px'; sc.style.top = G.oy + 'px';
  }
  function union(h) {
    if (!h || !h.length) return null;
    var x1 = 100, y1 = 100, x2 = 0, y2 = 0;
    h.forEach(function (r) { x1 = Math.min(x1, r.x); y1 = Math.min(y1, r.y); x2 = Math.max(x2, r.x + r.w); y2 = Math.max(y2, r.y + r.h); });
    return { x: x1, y: y1, w: x2 - x1, h: y2 - y1, cx: (x1 + x2) / 2, cy: (y1 + y2) / 2 };
  }
  function camera(s, u, instant) {
    var cam = $('cam'), z = 1;
    if (u) z = s.zoom || Math.min(1.45, Math.max(1, 0.6 * Math.min(G.vw / (u.w / 100 * G.w), G.vh / (u.h / 100 * G.h))));
    /* the window in screen pixels is [-ox, -ox+vw] x [-oy, -oy+vh]; keep it covered by the zoomed picture */
    var cx = u ? u.cx / 100 * G.w : G.w / 2, cy = u ? u.cy / 100 * G.h : G.h / 2;
    var tx = (-G.ox + G.vw / 2) - cx * z, ty = (-G.oy + G.vh / 2) - cy * z;
    tx = Math.min(-G.ox, Math.max(-G.ox + G.vw - G.w * z, tx));
    ty = Math.min(-G.oy, Math.max(-G.oy + G.vh - G.h * z, ty));
    cam.classList.toggle('snap', !!instant);
    cam.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + z + ')';
  }
  window.addEventListener('resize', function () { fit(); if (MOD && idx >= 0 && idx < MOD.steps.length) camera(MOD.steps[idx], union(MOD.steps[idx].hot), true); });

  /* ---------- drawing ---------- */
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function setAcc(c) { if (c) document.documentElement.style.setProperty('--acc', c); }
  function drawProg() {
    var p = $('prog'); p.innerHTML = '';
    MOD.steps.forEach(function (s, i) { var b = document.createElement('button'); b.title = (i + 1) + '. ' + s.title; b.innerHTML = '<i></i>'; b.onclick = function () { playing = true; paintPlay(); go(i); }; p.appendChild(b); });
  }
  function paintProg(dur) {
    var bs = $('prog').children;
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i], bar = b.firstChild; b.className = i < idx ? 'done' : i === idx ? 'now' : '';
      bar.style.transition = 'none'; bar.style.width = i < idx ? '100%' : '0';
      if (i === idx && dur) { void bar.offsetWidth; bar.style.transition = 'width ' + dur + 'ms linear'; bar.style.width = '100%'; }
    }
    $('cnt').textContent = idx < 0 ? '' : idx >= MOD.steps.length ? 'DONE' : (idx + 1) + ' / ' + MOD.steps.length;
  }
  function show(i) {
    var s = MOD.steps[i];
    clearTimeout(timer); hush(); var my = tok;
    var hots = $('hots'), holes = $('holes'), cam = $('cam');
    $('dim').classList.remove('show');
    [].forEach.call(hots.children, function (h) { h.classList.remove('show'); });
    var A = flip ? $('imgA') : $('imgB'), B = flip ? $('imgB') : $('imgA');
    var same = B.getAttribute('src') === s.img && B.classList.contains('show');
    if (!same) flip = !flip; else { A = B; }
    var start = function () {
      if (my !== tok) return;
      if (!same) {
        camera(s, null, true); void cam.offsetWidth;
        A.classList.add('show'); B.classList.remove('show');
        $('flash').classList.remove('go'); void $('flash').offsetWidth; $('flash').classList.add('go');
        $('scan').classList.remove('go'); void $('scan').offsetWidth; $('scan').classList.add('go');
      }
      hots.innerHTML = ''; holes.innerHTML = '';
      (s.hot || []).forEach(function (r, k) {
        var d = document.createElement('div'); d.className = 'hot';
        d.style.cssText = 'left:' + r.x + '%;top:' + r.y + '%;width:' + r.w + '%;height:' + r.h + '%;transition-delay:' + (0.55 + k * 0.35) + 's';
        if (s.hot.length > 1) d.innerHTML = '<i>' + (k + 1) + '</i>';
        hots.appendChild(d);
        holes.insertAdjacentHTML('beforeend', '<rect x="' + r.x + '" y="' + r.y + '" width="' + r.w + '" height="' + r.h + '" rx=".6" fill="black"/>');
      });
      var u = union(s.hot);
      setTimeout(function () { if (my !== tok) return; camera(s, u); if (u) $('dim').classList.add('show'); [].forEach.call(hots.children, function (h) { h.classList.add('show'); }); }, 120);
      /* the pointer glides to the first hotspot and clicks */
      var c = $('cur'), f = (s.hot || [])[0];
      c.style.transition = 'none'; c.style.left = (f ? Math.min(96, f.x + f.w + 6) : 60) + '%'; c.style.top = '104%'; c.style.opacity = f ? 1 : 0; void c.offsetWidth; c.style.transition = '';
      if (f) setTimeout(function () {
        if (my !== tok) return; var px = f.x + Math.min(f.w / 2, 6), py = f.y + f.h / 2; c.style.left = px + '%'; c.style.top = py + '%';
        setTimeout(function () { if (my !== tok) return; var r = document.createElement('div'); r.className = 'rip'; r.style.left = px + '%'; r.style.top = py + '%'; cam.appendChild(r); setTimeout(function () { r.remove(); }, 800); }, 1150);
      }, 500);
      setTimeout(function () {
        if (my !== tok) return;
        paintProg(autoOn && playing ? Math.max(3500, s.say.split(/\s+/).length * 360 + 600) : 0);
        if (!playing) return;
        say(s.title + '. ' + s.say, function () {
          if (my !== tok) return; var bs = $('prog').children; if (bs[idx]) { bs[idx].firstChild.style.transition = 'width .3s'; bs[idx].firstChild.style.width = '100%'; }
          if (autoOn && playing) timer = setTimeout(function () { if (my === tok) next(); }, 1300);
        });
      }, 900);
    };
    if (same || (A.getAttribute('src') === s.img && A.complete)) start();
    else { A.onload = start; A.onerror = start; A.src = s.img; }
    var n = MOD.steps[i + 1]; if (n) { var pre = new Image(); pre.src = n.img; }
  }
  function go(i) {
    if (!MOD) return;
    $('sCover').classList.add('out'); setTimeout(function () { $('sCover').hidden = true; }, 600); $('sEnd').hidden = true;
    if (i >= MOD.steps.length) return end();
    idx = Math.max(0, i); show(idx); paintProg(0);
  }
  function next() { go(idx + 1); }
  function prev() { playing = true; paintPlay(); go(Math.max(0, idx - 1)); }
  function end() {
    hush(); clearTimeout(timer); idx = MOD.steps.length; paintProg(0);
    var others = DATA.modules.filter(function (m) { return m.mode === MOD.mode && m.id !== MOD.id; });
    var e = $('sEnd'); e.hidden = false; e.classList.remove('out');
    e.innerHTML = '<svg width="90" height="90" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--acc);animation:rise .8s ease both"><circle cx="12" cy="12" r="10"/><path d="m7 12.5 3.2 3.2L17 9"/></svg>' +
      '<small>Training complete</small><h1>' + esc(MOD.title) + '</h1><div class="btns" style="margin-top:24px"><button class="go-btn" id="eAgain">↻ Watch again</button>' + (EMBED ? '<button class="go-btn ghost" id="eClose">Back to the dashboard</button>' : '') + '</div>' +
      (others.length ? '<div class="list" style="margin-top:30px">' + others.map(function (m) { return '<button data-m="' + m.id + '" style="--c:' + m.color + '"><div><b>' + esc(m.title) + '</b><span>' + esc(m.subtitle || '') + '</span></div></button>'; }).join('') + '</div>' : '');
    $('eAgain').onclick = function () { playing = true; paintPlay(); go(0); };
    if ($('eClose')) $('eClose').onclick = close;
    [].forEach.call(e.querySelectorAll('[data-m]'), function (b) { b.onclick = function () { open(b.dataset.m, true); }; });
    if (voiceOn && MOD.outro) say(MOD.outro, function () { });
  }
  function cover(start) {
    var c = $('sCover'); c.hidden = false; c.classList.remove('out'); $('sEnd').hidden = true;
    var n = MOD.steps.length, min = Math.max(1, Math.round(MOD.steps.reduce(function (a, s) { return a + s.say.split(/\s+/).length * 0.4 + 3; }, 0) / 60));
    c.innerHTML = '<img class="lg" src="../Images/logo.png" alt="" onerror="this.remove()"><small>Academic Dashboard · ' + (MOD.mode === 'admin' ? 'Admin' : 'Teacher') + ' training</small><h1>' + esc(MOD.title) + '</h1><p>' + esc(MOD.subtitle || '') + '</p>' +
      '<div class="meta"><span><b>' + n + '</b>steps</span><span><b>~' + min + ' min</b>duration</span></div>' +
      '<button class="go-btn" id="cGo"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>Start training</button>';
    $('cGo').onclick = function () { playing = true; paintPlay(); if (voiceOn && MOD.intro) { $('cGo').disabled = true; $('cGo').lastChild.textContent = 'Starting…'; say(MOD.intro, function () { go(0); }); } else go(0); };
    if (start) $('cGo').click();
  }
  function chooser(msg) {
    hush(); clearTimeout(timer); MOD = null; $('mTitle').textContent = 'Academic Dashboard'; $('prog').innerHTML = ''; $('cnt').textContent = '';
    var c = $('sCover'); c.hidden = false; c.classList.remove('out'); $('sEnd').hidden = true;
    var mode = Q.get('mode'), list = (DATA ? DATA.modules : []).filter(function (m) { return !mode || m.mode === mode; });
    c.innerHTML = '<img class="lg" src="../Images/logo.png" alt="" onerror="this.remove()"><small>Academic Dashboard</small><h1>Training</h1>' + (msg ? '<p class="err">' + esc(msg) + '</p>' : '') +
      '<div class="list">' + list.map(function (m) { return '<button data-m="' + m.id + '" style="--c:' + m.color + '"><div><b>' + esc(m.title) + '</b><span>' + esc(m.subtitle || '') + ' · ' + m.steps.length + ' steps</span></div></button>'; }).join('') + '</div>';
    [].forEach.call(c.querySelectorAll('[data-m]'), function (b) { b.onclick = function () { open(b.dataset.m, true); }; });
  }
  function open(id, autostart) {
    hush(); clearTimeout(timer);
    MOD = DATA.modules.filter(function (m) { return m.id === id; })[0];
    if (!MOD) return chooser('This training was not found.');
    idx = -1; setAcc(MOD.color); $('mTitle').textContent = MOD.title; document.title = MOD.title + ' · Training';
    $('imgA').classList.remove('show'); $('imgB').classList.remove('show'); $('hots').innerHTML = ''; $('dim').classList.remove('show');
    drawProg(); paintProg(0); cover(autostart);
    try { history.replaceState(null, '', '?m=' + encodeURIComponent(id) + (EMBED ? '&embed=1' : '') + (Q.get('mode') ? '&mode=' + Q.get('mode') : '')); } catch (e) { }
  }
  function close() { hush(); clearTimeout(timer); if (EMBED && parent !== window) parent.postMessage({ kind: 'ad-training-close' }, '*'); else window.close(); }

  /* ---------- controls ---------- */
  function paintPlay() { $('bPlay').textContent = playing ? '❚❚' : '▶'; }
  function togglePlay() {
    if (!MOD || idx < 0 || idx >= MOD.steps.length) return;
    playing = !playing; paintPlay();
    if (!playing) { hush(); clearTimeout(timer); paintProg(0); } else show(idx);
  }
  function paintToggles() { $('bVoice').classList.toggle('on', voiceOn); $('wav').style.display = voiceOn ? '' : 'none'; $('bAuto').classList.toggle('on', autoOn); }
  $('bVoice').onclick = function () { voiceOn = !voiceOn; try { localStorage.setItem('adTrVoice', voiceOn ? '1' : '0'); } catch (e) { } paintToggles(); if (!voiceOn) hush(); if (MOD && idx >= 0 && idx < MOD.steps.length && playing) show(idx); };
  $('bAuto').onclick = function () { autoOn = !autoOn; try { localStorage.setItem('adTrAuto', autoOn ? '1' : '0'); } catch (e) { } paintToggles(); if (MOD && idx >= 0 && idx < MOD.steps.length) show(idx); };
  $('bPrev').onclick = prev; $('bNext').onclick = function () { if (MOD) { playing = true; paintPlay(); go(idx + 1); } };
  $('bPlay').onclick = togglePlay; $('bClose').onclick = close;
  $('bMenu').onclick = function () { chooser(); };
  document.addEventListener('keydown', function (e) {
    wake();
    if (e.key === 'ArrowRight') $('bNext').click(); else if (e.key === 'ArrowLeft') prev();
    else if (e.key === ' ') { e.preventDefault(); togglePlay(); } else if (e.key === 'Escape') close();
    else if (e.key === 'm' || e.key === 'M') $('bVoice').click();
  });
  /* the controls fade out while the mouse rests */
  var idleT = 0; function wake() { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(function () { if (!document.querySelector('.ui:hover')) document.body.classList.add('idle'); else wake(); }, 2600); }
  ['mousemove', 'mousedown', 'touchstart'].forEach(function (ev) { document.addEventListener(ev, wake, { passive: true }); });
  window.addEventListener('beforeunload', hush);
  window.addEventListener('message', function (e) { if (e.data && e.data.kind === 'ad-training-open' && DATA) open(e.data.id); });
  paintToggles(); paintPlay(); fit(); wake();
  if (!EMBED && !window.opener) $('bClose').style.display = 'none';

  load().then(function (d) { DATA = d; if (d.picture && d.picture.w) { IW = d.picture.w; IH = d.picture.h; fit(); } var m = Q.get('m'); if (m) open(m); else chooser(); })
    .catch(function (e) { DATA = { modules: [] }; chooser('The training data could not be loaded: ' + e.message); });
})();
</script>
</body>
</html>
